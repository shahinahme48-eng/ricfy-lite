<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Domino Pro Multiplayer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    /* CSS STYLE */
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #0f172a; color: white; text-align: center; }
    
    .container { max-width: 600px; margin: 0 auto; padding: 10px; }
    
    /* Login & Lobby */
    .screen { display: none; padding: 20px; background: #1e293b; border-radius: 10px; margin-top: 20px; }
    .active { display: block; }

    input { padding: 10px; margin: 5px; width: 80%; border-radius: 5px; border: none; }
    button { padding: 10px 20px; margin: 10px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; }
    button:disabled { background: #64748b; cursor: not-allowed; }
    .btn-green { background: #22c55e; }
    .btn-red { background: #ef4444; }

    /* Game Board */
    #gameArea { display: none; }
    
    #boardContainer { 
      overflow-x: auto; background: #052e16; padding: 20px; 
      margin: 10px 0; border-radius: 10px; border: 4px solid #553e28; min-height: 120px; 
      display: flex; align-items: center; white-space: nowrap;
    }
    
    .tile { 
      background: #f8fafc; color: black; width: 38px; height: 68px; 
      display: inline-flex; flex-direction: column; justify-content: center; align-items: center; 
      border-radius: 4px; font-weight: bold; font-size: 18px; margin: 2px;
      border: 1px solid #94a3b8; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); vertical-align: middle;
    }
    .tile div { line-height: 0.8; }
    .tile:hover { transform: translateY(-3px); }

    .player-box { 
      border: 1px dashed #475569; padding: 5px; margin: 5px; border-radius: 5px; 
      background: #334155; min-height: 60px;
    }
    .my-turn { border: 2px solid #22c55e; box-shadow: 0 0 10px #22c55e; }

    #roomCodeDisplay { font-size: 24px; color: #facc15; letter-spacing: 2px; font-weight: bold; }
    #playerList { text-align: left; margin: 10px; color: #cbd5e1; }
  </style>
</head>
<body>

<div class="container">
  <h2>🎴 Domino Master</h2>
  <div id="status" style="color: yellow; font-size: 14px;">Connecting...</div>

  <!-- SCREEN 1: MENU -->
  <div id="menuScreen" class="screen active">
    <input id="playerName" placeholder="Enter Your Name (e.g. Shahin)">
    <br>
    <button onclick="createRoom()">Create Room</button>
    <br>
    <p>-- OR --</p>
    <input id="roomCodeInput" placeholder="Enter Room Code">
    <br>
    <button onclick="joinRoom()">Join Room</button>
  </div>

  <!-- SCREEN 2: LOBBY -->
  <div id="lobbyScreen" class="screen">
    <h3>Room Code:</h3>
    <div id="roomCodeDisplay">...</div>
    <p>Share this code with friends!</p>
    
    <div id="playerList">
      Waiting for players...
    </div>

    <button id="btnStartGame" class="btn-green" style="display:none;" onclick="startGame()">Start Game</button>
    <p id="waitingMsg">Waiting for Host to start...</p>
  </div>

  <!-- SCREEN 3: GAME BOARD -->
  <div id="gameArea">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="turnIndicator">Turn: ...</span>
      <button class="btn-red" onclick="location.reload()">Exit</button>
    </div>

    <div id="boardContainer"></div>

    <!-- PLAYERS AREA -->
    <div id="playersContainer"></div>

    <button id="drawBtn" onclick="drawTile()">🎲 Draw Tile from Boneyard</button>
    
    <!-- CHAT -->
    <div style="margin-top:20px; border-top:1px solid #475569; padding-top:10px;">
        <div id="chatBox" style="height:100px; overflow-y:auto; text-align:left; font-size:12px;"></div>
        <div style="display:flex;">
            <input id="chatInput" placeholder="Message..." style="flex:1;">
            <button onclick="sendChat()" style="margin:5px; padding:5px 10px;">Send</button>
        </div>
    </div>
  </div>

</div>

<!-- FIREBASE LOGIC -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, updateDoc, getDoc,
    onSnapshot, collection, addDoc, serverTimestamp, query, orderBy
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAXXWgGt8WbMzmgn2ukdB4qtP5xwr2jz5E",
    authDomain: "studio-343961532-65f17.firebaseapp.com",
    projectId: "studio-343961532-65f17",
    storageBucket: "studio-343961532-65f17.firebasestorage.app",
    messagingSenderId: "667987171288",
    appId: "1:667987171288:web:ffadb2286957b28b4b84ad"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let roomId = null;
  let myPlayerId = null;
  let myName = "";
  let isHost = false;

  // 1. Auto Login
  signInAnonymously(auth).then(() => {
    document.getElementById("status").innerText = "Online - Ready";
  }).catch(e => alert("Login Error: "+e.message));

  // --- FUNCTIONS ---

  // Generate Tiles as OBJECTS {a:1, b:2} not Arrays [1,2]
  function generateTiles(){
    let t=[];
    for(let i=0;i<=6;i++){
      for(let j=i;j<=6;j++){
        t.push({a:i, b:j}); // FIXED: Using Objects
      }
    }
    return t.sort(()=>Math.random()-0.5);
  }

  // CREATE ROOM
  window.createRoom = async function(){
    myName = document.getElementById("playerName").value || "Host";
    roomId = Math.random().toString(36).substring(2,7).toUpperCase();
    myPlayerId = "p1";
    isHost = true;

    await setDoc(doc(db,"rooms",roomId), {
      status: "lobby",
      players: {
        p1: { name: myName, tiles: [] }
      },
      board: [],
      tiles: generateTiles(), // Full set in boneyard initially
      turn: "p1"
    });

    enterLobby();
  }

  // JOIN ROOM
  window.joinRoom = async function(){
    myName = document.getElementById("playerName").value || "Guest";
    roomId = document.getElementById("roomCodeInput").value.toUpperCase().trim();
    if(!roomId) return alert("Enter Code");

    const ref = doc(db,"rooms",roomId);
    const snap = await getDoc(ref);
    if(!snap.exists()) return alert("Room not found");
    
    let data = snap.data();
    if(data.status !== "lobby") return alert("Game already started!");
    
    let count = Object.keys(data.players).length;
    if(count >= 4) return alert("Room Full");

    myPlayerId = "p" + (count + 1);
    data.players[myPlayerId] = { name: myName, tiles: [] };

    await updateDoc(ref, { players: data.players });
    enterLobby();
  }

  function enterLobby(){
    document.getElementById("menuScreen").classList.remove("active");
    document.getElementById("lobbyScreen").classList.add("active");
    document.getElementById("roomCodeDisplay").innerText = roomId;
    
    // Listen for updates
    onSnapshot(doc(db,"rooms",roomId), (snap) => {
      let data = snap.data();
      if(!data) return;

      // Update Player List in Lobby
      let listHtml = "<b>Players Joined:</b><br>";
      Object.keys(data.players).forEach(pid => {
        listHtml += `👤 ${data.players[pid].name} <br>`;
      });
      document.getElementById("playerList").innerHTML = listHtml;

      // Show Start Button only to Host (p1)
      if(myPlayerId === "p1" && data.status === "lobby"){
        document.getElementById("btnStartGame").style.display = "inline-block";
        document.getElementById("waitingMsg").style.display = "none";
      }

      // If Game Started, Switch Screen
      if(data.status === "playing"){
        startGameUI(data);
      }
    });

    listenChat();
  }

  // START GAME (Host Only)
  window.startGame = async function(){
    const ref = doc(db,"rooms",roomId);
    const snap = await getDoc(ref);
    let data = snap.data();

    // Distribute 7 tiles to each connected player
    Object.keys(data.players).forEach(pid => {
      data.players[pid].tiles = data.tiles.splice(0, 7);
    });

    await updateDoc(ref, {
      players: data.players,
      tiles: data.tiles,
      status: "playing"
    });
  }

  function startGameUI(data){
    document.getElementById("lobbyScreen").classList.remove("active");
    document.getElementById("gameArea").style.display = "block";
    renderBoard(data);
  }

  // RENDER GAME
  function renderBoard(g){
    // Turn Status
    let turnName = g.players[g.turn]?.name || "Unknown";
    document.getElementById("turnIndicator").innerHTML = 
      `Turn: <b style="color:${g.turn===myPlayerId?'#4ade80':'white'}">${turnName}</b>`;

    // Board Render
    const boardEl = document.getElementById("boardContainer");
    boardEl.innerHTML = "";
    g.board.forEach(t => {
      // t is {a:1, b:2}
      boardEl.innerHTML += `
        <div class="tile" style="background:white; cursor:default;">
           <div>${t.a}</div><div style="height:1px;width:25px;background:black;margin:2px;"></div><div>${t.b}</div>
        </div>`;
    });

    // Players Render
    const pContainer = document.getElementById("playersContainer");
    pContainer.innerHTML = "";

    // Show ME first, then others
    let playerKeys = Object.keys(g.players).sort(); 
    
    playerKeys.forEach(pid => {
      let p = g.players[pid];
      let isMe = (pid === myPlayerId);
      let isTurn = (g.turn === pid);
      
      let html = `
        <div class="player-box ${isTurn ? 'my-turn' : ''}">
           <div style="font-size:12px; margin-bottom:5px;">${p.name} ${isMe?'(You)':''} - Tiles: ${p.tiles.length}</div>
           <div>`;
           
      p.tiles.forEach((t, idx) => {
        if(isMe){
          // My Tiles (Clickable)
          html += `<div class="tile" onclick="playTile(${idx})" style="cursor:pointer; background:${isTurn?'white':'#cbd5e1'}">
             <div>${t.a}</div><div style="height:1px;width:25px;background:black;margin:2px;"></div><div>${t.b}</div>
          </div>`;
        } else {
          // Enemy Tiles (Hidden)
          html += `<div class="tile" style="background:#475569; color:#475569; width:25px; height:45px; border:none;">?</div>`;
        }
      });

      html += `</div></div>`;
      pContainer.innerHTML += html;
    });
  }

  // PLAY TILE LOGIC
  window.playTile = async function(idx){
    const ref = doc(db,"rooms",roomId);
    const snap = await getDoc(ref);
    const g = snap.data();

    if(g.turn !== myPlayerId) return alert("Not your turn!");

    let tile = g.players[myPlayerId].tiles[idx]; // {a:1, b:2}
    let played = false;

    if(g.board.length === 0){
      g.board.push(tile);
      played = true;
    } else {
      let left = g.board[0].a;
      let right = g.board[g.board.length-1].b;
      
      // Try Right
      if(right === tile.a) { g.board.push({a: tile.a, b: tile.b}); played=true; }
      else if(right === tile.b) { g.board.push({a: tile.b, b: tile.a}); played=true; } // Flip
      // Try Left
      else if(left === tile.b) { g.board.unshift({a: tile.a, b: tile.b}); played=true; }
      else if(left === tile.a) { g.board.unshift({a: tile.b, b: tile.a}); played=true; } // Flip
    }

    if(!played) return alert("Tile does not match!");

    // Remove tile and Switch turn
    g.players[myPlayerId].tiles.splice(idx, 1);
    
    // Check Win
    if(g.players[myPlayerId].tiles.length === 0){
        alert("🎉 YOU WON! 🎉");
        await updateDoc(ref, { status: "finished", winner: myName });
        return;
    }

    // Next Player Logic
    let pIds = Object.keys(g.players).sort();
    let currIdx = pIds.indexOf(myPlayerId);
    let nextIdx = (currIdx + 1) % pIds.length;
    let nextPid = pIds[nextIdx];

    await updateDoc(ref, {
      board: g.board,
      players: g.players,
      turn: nextPid
    });
  }

  // DRAW TILE
  window.drawTile = async function(){
    const ref = doc(db,"rooms",roomId);
    const snap = await getDoc(ref);
    const g = snap.data();

    if(g.turn !== myPlayerId) return alert("Wait for turn!");
    if(g.tiles.length === 0) return alert("No tiles left!");

    g.players[myPlayerId].tiles.push(g.tiles.pop());
    await updateDoc(ref, { players: g.players, tiles: g.tiles });
  }

  // CHAT
  function listenChat(){
    const q = query(collection(db,"rooms",roomId,"chat"), orderBy("timestamp"));
    onSnapshot(q, (snap) => {
      document.getElementById("chatBox").innerHTML = snap.docs.map(d=>
        `<div><b>${d.data().sender}:</b> ${d.data().message}</div>`
      ).join("");
    });
  }

  window.sendChat = async function(){
    let msg = document.getElementById("chatInput").value;
    if(!msg) return;
    await addDoc(collection(db,"rooms",roomId,"chat"), {
      sender: myName, message: msg, timestamp: serverTimestamp()
    });
    document.getElementById("chatInput").value="";
  }
</script>

</body>
</html>
