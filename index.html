<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Domino Legend Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; user-select: none; }
    
    body { 
      margin: 0; 
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); 
      color: white; 
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* --- COIN & SUPPORT BADGES --- */
    .top-bar-overlay {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; z-index: 100;
      pointer-events: none;
    }

    .coin-badge {
      background: linear-gradient(to right, #f59e0b, #d97706);
      padding: 5px 15px; border-radius: 20px;
      font-weight: bold; font-size: 14px;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4);
      border: 2px solid #fcd34d; pointer-events: auto;
      display: flex; align-items: center; gap: 5px;
    }

    .wa-btn {
      background: #25D366; color: white;
      padding: 5px 15px; border-radius: 20px;
      font-weight: bold; font-size: 14px;
      border: 2px solid #128C7E; cursor: pointer; pointer-events: auto;
      text-decoration: none; display: flex; align-items: center; gap: 5px;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
    }

    /* --- SCREENS --- */
    .screen { display: none; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; }
    .active { display: flex; }

    .panel {
      background: rgba(30, 41, 59, 0.95);
      padding: 25px; border-radius: 16px;
      border: 1px solid #475569;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      width: 90%; max-width: 400px;
      text-align: center; position: relative;
    }

    /* --- FORM ELEMENTS --- */
    input { 
      width: 100%; padding: 12px; margin: 8px 0; 
      background: #0f172a; border: 1px solid #334155; 
      color: white; border-radius: 8px; text-align: center; font-size: 16px;
    }

    .main-btn {
      width: 100%; padding: 12px; margin-top: 10px; cursor: pointer;
      background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
      color: white; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 800; text-transform: uppercase;
      box-shadow: 0 4px 0 #1e3a8a; transition: transform 0.1s;
    }
    .main-btn:active { transform: translateY(3px); box-shadow: none; }
    
    .btn-green { background: linear-gradient(to bottom, #22c55e, #15803d); box-shadow: 0 4px 0 #14532d; }
    .btn-bonus { background: linear-gradient(to bottom, #8b5cf6, #6d28d9); box-shadow: 0 4px 0 #5b21b6; font-size: 12px; margin-bottom: 10px;}

    /* SELECTORS */
    .selector-group { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
    .select-btn {
      flex: 1; padding: 8px; cursor: pointer;
      background: #1e293b; border: 1px solid #475569;
      border-radius: 6px; color: #94a3b8; font-size: 12px; font-weight: bold;
    }
    .select-btn.selected {
      background: #0f172a; border-color: #3b82f6; color: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
    }

    /* --- LOBBY LIST --- */
    .player-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px; border-bottom: 1px solid #334155;
    }
    .gift-btn {
      background: #ec4899; color: white; border: none; border-radius: 15px;
      padding: 3px 10px; font-size: 10px; cursor: pointer; margin-left: 5px;
    }

    /* --- GAME TABLE --- */
    #gameArea { display: none; width: 100%; height: 100%; position: relative; background: #0f172a; }
    
    #pokerTable {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -60%);
      width: 95%; height: 50%;
      background: radial-gradient(circle, #15803d 0%, #064e3b 100%);
      border: 10px solid #78350f; border-radius: 100px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      display: flex; justify-content: center; align-items: center;
    }
    
    /* TILES */
    #boardScroll { width: 90%; height: 80%; display: flex; align-items: center; justify-content: center; overflow-x: auto; }
    .tile { 
      background: #fff; color: #000; 
      width: 34px; height: 60px; 
      display: inline-flex; flex-direction: column; justify-content: center; align-items: center; 
      border-radius: 4px; margin: 2px;
      box-shadow: 2px 2px 0 #9ca3af;
      font-size: 18px; font-weight: bold; flex-shrink: 0;
    }
    .tile div { line-height: 0.8; pointer-events: none; }

    /* AVATARS */
    .opponents-row { position: absolute; top: 60px; width: 100%; display: flex; justify-content: space-around; }
    .avatar-box { display: flex; flex-direction: column; align-items: center; width: 70px; position: relative; }
    .avatar-img { 
      width: 45px; height: 45px; border-radius: 50%; background: #334155; border: 2px solid #fff;
      display: flex; justify-content: center; align-items: center; font-size: 20px;
    }
    .active-turn .avatar-img { border-color: #facc15; box-shadow: 0 0 15px #facc15; animation: pulse 1s infinite; }

    /* MY HAND */
    .my-area { 
      position: absolute; bottom: 0; width: 100%; 
      background: rgba(15, 23, 42, 0.9); padding: 10px; 
      border-top: 2px solid #facc15;
    }
    .my-hand { display: flex; overflow-x: auto; justify-content: center; gap: 5px; padding-bottom: 5px; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

<!-- TOP BAR (Coins & WhatsApp) -->
<div class="top-bar-overlay">
  <!-- WhatsApp Button -->
  <a id="waLink" href="#" target="_blank" class="wa-btn">
    <i class="fab fa-whatsapp"></i> Help
  </a>
  
  <!-- Coin Badge -->
  <div class="coin-badge">
    <i class="fas fa-coins"></i> <span id="userCoins">Loading..</span>
  </div>
</div>

<!-- === SCREEN 1: MENU === -->
<div id="menuScreen" class="screen active">
  <div class="panel">
    <h2 style="margin:0; color:#facc15; text-transform: uppercase;">Domino Pro</h2>
    <p style="color:#94a3b8; font-size:11px; margin-bottom: 15px;">Win Coins & Challenge Friends</p>
    
    <input id="playerName" placeholder="Enter Your Nickname">
    
    <div style="text-align:left; margin-top:10px;">
        <label style="font-size:11px; color:#cbd5e1;">👥 Players:</label>
        <div class="selector-group">
            <div class="select-btn selected" onclick="selectPlayers(2, this)">2 Players</div>
            <div class="select-btn" onclick="selectPlayers(4, this)">4 Players</div>
        </div>

        <label style="font-size:11px; color:#cbd5e1;">💰 Bet Amount:</label>
        <div class="selector-group">
            <div class="select-btn selected" onclick="selectBet(100, this)">100</div>
            <div class="select-btn" onclick="selectBet(500, this)">500</div>
            <div class="select-btn" onclick="selectBet(2000, this)">2K</div>
        </div>
    </div>

    <button onclick="createRoom()" class="main-btn btn-green">CREATE ROOM</button>
    <div style="font-size:12px; margin:8px; color:#64748b;">— OR —</div>
    <input id="roomCodeInput" placeholder="Room Code (e.g. A1B2C)">
    <button onclick="joinRoom()" class="main-btn">JOIN ROOM</button>
    
    <!-- Daily Bonus -->
    <div style="margin-top:20px;">
      <button onclick="claimBonus()" class="main-btn btn-bonus">🎁 Daily Free Coins</button>
    </div>
  </div>
</div>

<!-- === SCREEN 2: LOBBY === -->
<div id="lobbyScreen" class="screen">
  <div class="panel">
    <h4 style="color:#94a3b8; margin:0">Room Code</h4>
    <h1 id="lobbyCode" style="font-size:36px; color:#facc15; letter-spacing:3px; margin:5px 0;">...</h1>
    
    <div id="lobbyInfo" style="font-size:12px; color:#4ade80;">...</div>

    <div id="playerList" style="background:#1e293b; padding:10px; border-radius:8px; margin:15px 0; text-align:left; max-height:150px; overflow-y:auto;">
      Waiting...
    </div>

    <p id="waitMsg" style="font-size:11px; color:#94a3b8;">Game starts automatically when full.</p>
    <button onclick="location.reload()" style="background:#ef4444; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Leave</button>
  </div>
</div>

<!-- === SCREEN 3: GAMEPLAY === -->
<div id="gameArea">
  <div style="position:absolute; top:50px; left:10px; font-size:11px; color:rgba(255,255,255,0.4);">
      Pot: <span id="gamePot" style="color:#facc15; font-weight:bold;">0</span> 💰
  </div>
  
  <button onclick="location.reload()" style="position:absolute; top:50px; right:10px; padding:4px 8px; background:#ef4444; color:white; border:none; border-radius:4px; cursor:pointer; font-size:10px;">Exit</button>

  <div class="opponents-row" id="opponentsDiv"></div>

  <div id="pokerTable">
    <div id="boardScroll"></div>
    <div id="centerText" style="color:rgba(255,255,255,0.15); font-size:24px; font-weight:bold;">DOMINO</div>
  </div>

  <div class="my-area">
    <div style="display:flex; justify-content:space-between; margin-bottom:5px; align-items:center;">
        <div id="turnStatus" style="font-size:12px; font-weight:bold; color:#facc15;">Connecting...</div>
        <button onclick="drawTile()" style="background:#f59e0b; border:none; padding:4px 12px; border-radius:15px; cursor:pointer; font-weight:bold; font-size:12px; color:black;">🎲 Draw</button>
    </div>
    <div class="my-hand" id="myHandDiv"></div>
  </div>
</div>

<!-- FIREBASE & LOGIC -->
<script type="module">
  // ============================================
  // ✅ FIXED NUMBER (Note: Use Quotes " ")
  const ADMIN_WHATSAPP = "971566932862";
  // ============================================

  document.getElementById("waLink").href = `https://wa.me/${ADMIN_WHATSAPP}?text=Hello Admin, I need help with Domino Game coins.`;

  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, updateDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAXXWgGt8WbMzmgn2ukdB4qtP5xwr2jz5E",
    authDomain: "studio-343961532-65f17.firebaseapp.com",
    projectId: "studio-343961532-65f17",
    storageBucket: "studio-343961532-65f17.firebasestorage.app",
    messagingSenderId: "667987171288",
    appId: "1:667987171288:web:ffadb2286957b28b4b84ad"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // --- STATE ---
  let myName = localStorage.getItem("dominoName") || "";
  if(myName) document.getElementById("playerName").value = myName;
  
  let myPlayerId = "";
  let roomId = "";
  let selectedPlayers = 2;
  let selectedBet = 100;
  let myCoins = parseInt(localStorage.getItem("dominoCoins"));

  // First time User? Give 2000 Coins
  if(!myCoins && myCoins !== 0) {
      myCoins = 2000;
      localStorage.setItem("dominoCoins", myCoins);
  }

  // Update Coin Display immediately
  document.getElementById("userCoins").innerText = myCoins;

  signInAnonymously(auth).catch(e=>console.error(e));

  // --- UI HELPERS ---
  window.selectPlayers = (n,b) => { selectedPlayers=n; document.querySelectorAll('.select-btn').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); }
  window.selectBet = (n,b) => { selectedBet=n; document.querySelectorAll('.bet-btn').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); }

  function updateCoins(n){
    myCoins = n;
    localStorage.setItem("dominoCoins", myCoins);
    document.getElementById("userCoins").innerText = myCoins;
  }

  // --- DAILY BONUS ---
  window.claimBonus = function(){
    let lastClaim = localStorage.getItem("lastBonus");
    let today = new Date().toDateString();
    if(lastClaim === today){
      alert("❌ You already claimed today's bonus! Come back tomorrow.");
    } else {
      updateCoins(myCoins + 500);
      localStorage.setItem("lastBonus", today);
      alert("🎁 Success! Received 500 Free Coins.");
    }
  }

  // --- CREATE ROOM ---
  window.createRoom = async function(){
    myName = document.getElementById("playerName").value || "Player";
    localStorage.setItem("dominoName", myName);

    if(myCoins < selectedBet) return alert("❌ Not enough coins! Contact Admin on WhatsApp.");

    roomId = Math.random().toString(36).substring(2,7).toUpperCase();
    myPlayerId = "p1";
    updateCoins(myCoins - selectedBet);

    await setDoc(doc(db,"rooms",roomId), {
      status: "lobby",
      config: { max: selectedPlayers, bet: selectedBet },
      players: { p1: { name: myName, tiles: [], gift: 0 } },
      board: [], tiles: generateTiles(), turn: "p1", winner: null
    });
    enterLobby();
  }

  // --- JOIN ROOM ---
  window.joinRoom = async function(){
    myName = document.getElementById("playerName").value || "Player";
    roomId = document.getElementById("roomCodeInput").value.toUpperCase().trim();
    if(!roomId) return alert("Enter Code");

    const ref = doc(db,"rooms",roomId);
    const snap = await getDoc(ref);
    if(!snap.exists()) return alert("Room not found");
    
    let data = snap.data();
    if(data.status !== "lobby") return alert("Game already started");
    if(Object.keys(data.players).length >= data.config.max) return alert("Room Full");
    if(myCoins < data.config.bet) return alert("❌ Need "+data.config.bet+" coins! Ask friend for Gift.");

    updateCoins(myCoins - data.config.bet);
    let pid = "p" + (Object.keys(data.players).length + 1);
    myPlayerId = pid;
    
    data.players[pid] = { name: myName, tiles: [], gift: 0 };
    
    // Auto Start
    if(Object.keys(data.players).length === data.config.max){
      data.status = "playing";
      Object.keys(data.players).forEach(p => data.players[p].tiles = data.tiles.splice(0,7));
    }

    await updateDoc(ref, { players: data.players, status: data.status, tiles: data.tiles });
    enterLobby();
  }

  function enterLobby(){
    document.getElementById("menuScreen").classList.remove("active");
    document.getElementById("lobbyScreen").classList.add("active");
    document.getElementById("lobbyCode").innerText = roomId;

    onSnapshot(doc(db,"rooms",roomId), (snap)=>{
      let data = snap.data();
      if(!data) return;

      // Check for Gifts received
      if(data.players[myPlayerId] && data.players[myPlayerId].gift > 0){
        let amount = data.players[myPlayerId].gift;
        updateCoins(myCoins + amount);
        alert(`🎁 You received ${amount} coins gift!`);
        // Reset gift in DB
        data.players[myPlayerId].gift = 0;
        updateDoc(doc(db,"rooms",roomId), { players: data.players });
      }

      document.getElementById("lobbyInfo").innerHTML = `Entry: ${data.config.bet} 💰 | Need: ${data.config.max} Players`;
      
      let html = "";
      Object.keys(data.players).forEach(pid => {
        let p = data.players[pid];
        let isMe = (pid === myPlayerId);
        
        html += `<div class="player-row">
           <div style="color:white; font-size:12px;">👤 ${p.name} ${isMe?'(You)':''}</div>
           ${!isMe ? `<button class="gift-btn" onclick="sendGift('${pid}')">🎁 Gift 500</button>` : ''}
        </div>`;
      });
      document.getElementById("playerList").innerHTML = html;

      if(data.status === "playing") startGame(data);
    });
  }

  // --- GIFT LOGIC ---
  window.sendGift = async function(targetPid){
    if(myCoins < 500) return alert("❌ Not enough coins to gift!");
    if(!confirm("Send 500 coins to this player?")) return;

    const ref = doc(db,"rooms",roomId);
    const snap = await getDoc(ref);
    let data = snap.data();

    // Deduct from me
    updateCoins(myCoins - 500);
    
    // Add pending gift to target
    if(!data.players[targetPid].gift) data.players[targetPid].gift = 0;
    data.players[targetPid].gift += 500;

    await updateDoc(ref, { players: data.players });
    alert("✅ Gift Sent!");
  }

  function startGame(data){
    document.getElementById("lobbyScreen").classList.remove("active");
    document.getElementById("gameArea").style.display = "block";
    document.getElementById("gamePot").innerText = data.config.bet * data.config.max;
    renderBoard(data);
  }

  function renderBoard(g){
    if(g.status === "finished"){
      if(g.winner === myPlayerId){
        alert("🏆 YOU WON!");
        updateCoins(myCoins + (g.config.bet * g.config.max));
      } else {
        alert("😢 You Lost!");
      }
      location.reload();
      return;
    }

    const bEl = document.getElementById("boardScroll");
    bEl.innerHTML = "";
    g.board.forEach(t => bEl.innerHTML += `<div class="tile"><div>${t.a}</div><div style="height:1px;width:100%;background:#ccc"></div><div>${t.b}</div></div>`);
    if(g.board.length) document.getElementById("centerText").style.display="none";

    const oppEl = document.getElementById("opponentsDiv");
    const myEl = document.getElementById("myHandDiv");
    oppEl.innerHTML=""; myEl.innerHTML="";

    Object.keys(g.players).sort().forEach(pid => {
      let p = g.players[pid];
      if(pid === myPlayerId){
        document.getElementById("turnStatus").innerText = (g.turn===pid) ? "🟢 YOUR TURN" : `🔴 Wait for ${g.players[g.turn].name}`;
        p.tiles.forEach((t,i) => {
           myEl.innerHTML += `<div class="tile" onclick="playTile(${i})" style="${g.turn===pid?'border:2px solid #22c55e;transform:scale(1.1);cursor:pointer':''}"><div>${t.a}</div><div></div><div>${t.b}</div></div>`;
        });
      } else {
        oppEl.innerHTML += `<div class="avatar-box ${g.turn===pid?'active-turn':''}"><div class="avatar-img"><i class="fas fa-user"></i></div><span style="background:red;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;justify-content:center;align-items:center;position:absolute;top:0;right:5px;">${p.tiles.length}</span><div style="font-size:9px;margin-top:2px;">${p.name}</div></div>`;
      }
    });
  }

  // --- GAME ACTIONS ---
  function generateTiles(){ let t=[]; for(let i=0;i<=6;i++) for(let j=i;j<=6;j++) t.push({a:i,b:j}); return t.sort(()=>Math.random()-0.5); }

  window.playTile = async function(idx){
    const ref = doc(db,"rooms",roomId);
    const snap = await getDoc(ref);
    const g = snap.data();
    if(g.turn !== myPlayerId) return;

    let t = g.players[myPlayerId].tiles[idx];
    let played=false;

    if(!g.board.length) { g.board.push(t); played=true; }
    else {
      let l=g.board[0].a, r=g.board[g.board.length-1].b;
      if(r===t.a){ g.board.push(t); played=true; }
      else if(r===t.b){ g.board.push({a:t.b,b:t.a}); played=true; }
      else if(l===t.b){ g.board.unshift(t); played=true; }
      else if(l===t.a){ g.board.unshift({a:t.b,b:t.a}); played=true; }
    }

    if(!played) return alert("❌ Invalid Move! Tile doesn't match.");
    g.players[myPlayerId].tiles.splice(idx,1);

    if(!g.players[myPlayerId].tiles.length) await updateDoc(ref, { status:"finished", winner:myPlayerId });
    else {
      let ids = Object.keys(g.players).sort();
      let next = ids[(ids.indexOf(myPlayerId)+1)%ids.length];
      await updateDoc(ref, { board:g.board, players:g.players, turn:next });
    }
  }

  window.drawTile = async function(){
    const ref = doc(db,"rooms",roomId);
    const snap = await getDoc(ref);
    const g = snap.data();
    if(g.turn!==myPlayerId) return;
    if(!g.tiles.length) return alert("⚠️ Boneyard Empty!");
    g.players[myPlayerId].tiles.push(g.tiles.pop());
    await updateDoc(ref,{players:g.players, tiles:g.tiles});
  }
</scrg.players[myPlayerId].tiles.push(g.tiles.pop());
    await updateDoc(ref,{players:g.players, tiles:g.tiles});
  }
</script>
</body>
</html>
