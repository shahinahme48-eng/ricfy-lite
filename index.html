<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Domino Pro Real</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* --- BASIC --- */
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; }

    /* --- THE TABLE (Green Felt) --- */
    #table {
      width: 100vw; height: 100vh;
      background: radial-gradient(circle, #2e7d32 0%, #1b5e20 100%);
      position: relative;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    #table::before {
      content: ""; position: absolute; top:0; left:0; right:0; bottom:0;
      border: 15px solid #3e2723; /* Wood Border */
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      pointer-events: none; z-index: 10;
    }

    /* --- TOP BAR --- */
    .top-bar {
      position: absolute; top: 20px; left: 20px; z-index: 20;
      display: flex; gap: 10px;
    }
    .badge {
      background: rgba(0,0,0,0.6); color: gold; 
      padding: 5px 15px; border-radius: 20px; font-weight: bold; border: 1px solid gold;
    }

    /* --- PLAYER AVATARS (Top) --- */
    .opponents {
      display: flex; justify-content: center; gap: 20px; padding-top: 25px; z-index: 15;
    }
    .avatar {
      width: 60px; height: 60px; border-radius: 50%;
      background: #444; border: 3px solid #ccc;
      position: relative; display: flex; justify-content: center; align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .avatar img { width: 100%; height: 100%; border-radius: 50%; }
    .card-count {
      position: absolute; bottom: -5px; right: -5px;
      background: red; color: white; width: 24px; height: 24px;
      border-radius: 50%; font-size: 12px; font-weight: bold;
      display: flex; justify-content: center; align-items: center; border: 2px solid white;
    }
    .active-player { border-color: gold; box-shadow: 0 0 15px gold; }

    /* --- BOARD AREA --- */
    #boardArea {
      flex: 1; display: flex; align-items: center; justify-content: center;
      overflow: auto; position: relative;
    }
    #boardScroll {
      display: flex; align-items: center; padding: 50px; min-width: 100%;
      justify-content: center;
    }

    /* --- TILE STYLING (Realistic) --- */
    .tile {
      background: #f4f1ea; /* Bone color */
      border-radius: 4px;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.6);
      position: relative;
      display: flex;cursor: pointer;
      box-sizing: border-box;
      border: 1px solid #999;
    }
    
    /* Horizontal (Normal) */
    .tile-h { width: 70px; height: 35px; flex-direction: row; }
    /* Vertical (Double) */
    .tile-v { width: 35px; height: 70px; flex-direction: column; }

    .line-h { width: 1px; height: 100%; background: #bdc3c7; }
    .line-v { width: 100%; height: 1px; background: #bdc3c7; }

    /* Pips (Dots) */
    .pips {
      flex: 1; display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      grid-template-rows: repeat(3, 1fr);
      padding: 3px;
    }
    .dot {
      width: 6px; height: 6px; background: #000; border-radius: 50%;
      margin: auto; box-shadow: inset 1px 1px 1px rgba(255,255,255,0.8);
    }

    /* --- MY HAND (Bottom) --- */
    .my-area {
      background: rgba(0,0,0,0.5);
      border-top: 5px solid #3e2723;
      padding: 10px; display: flex; flex-direction: column; align-items: center;
      z-index: 20;
    }
    .my-hand {
      display: flex; gap: 8px; overflow-x: auto; padding: 10px; max-width: 100%;
    }
    .hand-tile {
      width: 38px; height: 76px; background: #fff;
      display: flex; flex-direction: column;
      border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }
    .hand-tile:hover { transform: translateY(-15px); }

    /* --- BONEYARD MODAL (Like Screenshot) --- */
    #boneyardModal {
      display: none;
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 1000;
      flex-direction: column; justify-content: center; align-items: center;
    }
    .boneyard-grid {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
      max-width: 80%;
    }
    .facedown-tile {
      width: 40px; height: 70px;
      background: linear-gradient(135deg, #e0c39a 0%, #5d4037 100%);
      border: 2px solid #fff; border-radius: 4px;
      cursor: pointer;
    }
    .facedown-tile:active { transform: scale(0.9); }

    /* --- LOGIN SCREEN --- */
    #login {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background: radial-gradient(circle, #2c3e50 0%, #000 100%);
      z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
    }
    input { padding: 12px; margin: 10px; border-radius: 5px; border: none; text-align: center; font-size: 16px; }
    .btn { padding: 12px 30px; margin: 5px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
    .btn-gold { background: linear-gradient(to bottom, #ffd700, #ff8c00); color: black; }
    
  </style>
</head>
<body>

<!-- === LOGIN === -->
<div id="login">
  <img src="https://cdn-icons-png.flaticon.com/512/566/566324.png" width="80" style="margin-bottom:20px;">
  <h1 style="margin:0; text-transform:uppercase; letter-spacing:2px; color:gold;">Domino Pro</h1>
  <p style="color:#aaa;">Online Multiplayer</p>
  
  <input id="pName" placeholder="Enter Nickname">
  
  <div style="display:flex; gap:10px;">
    <button class="btn btn-gold" onclick="createRoom()">Create Table</button>
  </div>
  <p>- OR -</p>
  <div style="display:flex; gap:10px;">
    <input id="code" placeholder="Room Code" style="width:100px; margin:0;">
    <button class="btn" style="background:#fff;" onclick="joinRoom()">Join</button>
  </div>
</div>

<!-- === BONEYARD POPUP (Draw Tiles) === -->
<div id="boneyardModal">
  <h2 style="color:white; margin-bottom:20px;">Draw a Domino</h2>
  <div class="boneyard-grid" id="boneyardGrid">
    <!-- Face down tiles will be injected here -->
  </div>
  <button onclick="closeBoneyard()" style="margin-top:30px; padding:10px 20px; background:red; color:white; border:none; border-radius:5px; cursor:pointer;">Cancel</button>
</div>

<!-- === MAIN TABLE === -->
<div id="table">
  
  <div class="top-bar">
    <div class="badge"><i class="fas fa-wifi"></i> <span id="roomInfo">...</span></div>
    <div class="badge">💰 <span id="myCoins">2000</span></div>
  </div>

  <!-- Opponents -->
  <div class="opponents" id="opponents"></div>

  <!-- Board -->
  <div id="boardArea">
    <div id="boardScroll"></div>
  </div>

  <!-- My Hand -->
  <div class="my-area">
    <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:5px;">
        <span id="turnMsg" style="color:white; font-weight:bold;">Connecting...</span>
        <button id="drawBtn" onclick="openBoneyard()" style="background:#ff8c00; border:none; padding:5px 15px; border-radius:15px; font-weight:bold; cursor:pointer; color:black; display:none;">
           Draw from Boneyard
        </button>
    </div>
    <div class="my-hand" id="myHand"></div>
  </div>

</div>

<!-- FIREBASE & LOGIC -->
<script type="module">
  // 🟢 CONFIGURATION - আপনার হোয়াটসঅ্যাপ নাম্বার এখানে দিন
  const ADMIN_WHATSAPP = "971566932862"; 

  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, updateDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAXXWgGt8WbMzmgn2ukdB4qtP5xwr2jz5E",
    authDomain: "studio-343961532-65f17.firebaseapp.com",
    projectId: "studio-343961532-65f17",
    storageBucket: "studio-343961532-65f17.firebasestorage.app",
    messagingSenderId: "667987171288",
    appId: "1:667987171288:web:ffadb2286957b28b4b84ad"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let myId, roomId, myName;
  signInAnonymously(auth);

  // --- DOT HELPER ---
  const dotPos = {
    0: [], 1: [4], 2: [2,6], 3: [2,4,6], 
    4: [0,2,6,8], 5: [0,2,4,6,8], 6: [0,2,3,5,6,8]
  };
  function getPips(n) {
    let h = "";
    for(let i=0; i<9; i++) h += dotPos[n].includes(i) ? `<div class="dot"></div>` : `<div></div>`;
    return `<div class="pips">${h}</div>`;
  }

  // --- ROOM LOGIC ---
  window.createRoom = async () => {
    myName = document.getElementById("pName").value || "Host";
    roomId = Math.random().toString(36).substring(2,7).toUpperCase();
    myId = "p1";
    let tiles = [];
    for(let i=0;i<=6;i++) for(let j=i;j<=6;j++) tiles.push({a:i,b:j});
    tiles.sort(()=>Math.random()-0.5);

    await setDoc(doc(db,"rooms",roomId), {
      board: [], tiles: tiles, turn: "p1",
      players: { p1: { name: myName, tiles: [] } }
    });
    // Give 7 tiles
    setTimeout(()=>drawTiles(7), 800);
    enterGame();
  };

  window.joinRoom = async () => {
    myName = document.getElementById("pName").value || "Guest";
    roomId = document.getElementById("code").value.toUpperCase();
    const ref = doc(db,"rooms",roomId);
    const snap = await getDoc(ref);
    if(!snap.exists()) return alert("Room Invalid");

    let d = snap.data();
    let count = Object.keys(d.players).length;
    if(count >= 4) return alert("Room Full");

    myId = "p"+(count+1);
    d.players[myId] = { name: myName, tiles: [] };
    await updateDoc(ref, { players: d.players });
    // Give 7 tiles
    setTimeout(()=>drawTiles(7), 800);
    enterGame();
  };

  async function drawTiles(n){
    const ref = doc(db,"rooms",roomId);
    const s = await getDoc(ref);
    let d = s.data();
    if(d.tiles.length < n) return;
    let hand = d.tiles.splice(0, n);
    d.players[myId].tiles.push(...hand);
    await updateDoc(ref, { players: d.players, tiles: d.tiles });
  }

  function enterGame(){
    document.getElementById("login").style.display = "none";
    document.getElementById("roomInfo").innerText = "Code: " + roomId;
    onSnapshot(doc(db,"rooms",roomId), (snap) => render(snap.data()));
  }

  // --- RENDER ---
  function render(g){
    // 1. Status
    let isTurn = (g.turn === myId);
    let turnName = g.players[g.turn].name;
    document.getElementById("turnMsg").innerHTML = isTurn ? 
        `<span style="color:#4ade80">🟢 YOUR TURN</span>` : 
        `<span style="color:#ffcc00">⏳ ${turnName}'s Turn</span>`;

    // 2. Draw Button Visibility
    document.getElementById("drawBtn").style.display = (isTurn && g.tiles.length > 0) ? "block" : "none";

    // 3. Render Board
    let bDiv = document.getElementById("boardScroll");
    bDiv.innerHTML = "";
    g.board.forEach(t => {
      let isDouble = (t.a === t.b);
      let cls = isDouble ? "tile tile-v" : "tile tile-h";
      bDiv.innerHTML += `
        <div class="${cls}">
           ${getPips(t.a)}
           <div class="${isDouble?'line-v':'line-h'}"></div>
           ${getPips(t.b)}
        </div>`;
    });

    // 4. My Hand
    let hDiv = document.getElementById("myHand");
    hDiv.innerHTML = "";
    if(g.players[myId]){
      g.players[myId].tiles.forEach((t, i) => {
        hDiv.innerHTML += `
          <div class="hand-tile" onclick="playTile(${i})" style="cursor:pointer; ${isTurn?'border:2px solid #4ade80':''}">
             ${getPips(t.a)}
             <div style="width:100%;height:1px;background:#ccc"></div>
             ${getPips(t.b)}
          </div>`;
      });
    }

    // 5. Opponents (Avatars)
    let oppDiv = document.getElementById("opponents");
    oppDiv.innerHTML = "";
    Object.keys(g.players).forEach(pid => {
       if(pid !== myId){
         let p = g.players[pid];
         oppDiv.innerHTML += `
           <div class="avatar ${g.turn===pid?'active-player':''}">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${p.name}">
              <div class="card-count">${p.tiles.length}</div>
           </div>`;
       }
    });

    // Update Boneyard Count in Modal
    window.remainingTiles = g.tiles.length;
  }

  // --- BONEYARD LOGIC (Like Screenshot) ---
  window.openBoneyard = () => {
    let modal = document.getElementById("boneyardModal");
    let grid = document.getElementById("boneyardGrid");
    grid.innerHTML = "";
    
    // Generate facedown tiles visually
    let count = window.remainingTiles || 0;
    if(count === 0) return alert("Boneyard Empty");

    // Limit visual tiles to max 14 for UI neatness
    let visualCount = Math.min(count, 14); 
    
    for(let i=0; i<visualCount; i++){
        let div = document.createElement("div");
        div.className = "facedown-tile";
        div.onclick = () => confirmDraw(); // Click any to draw
        grid.appendChild(div);
    }
    modal.style.display = "flex";
  };

  window.closeBoneyard = () => {
    document.getElementById("boneyardModal").style.display = "none";
  };

  window.confirmDraw = async () => {
    closeBoneyard();
    await drawTiles(1); // Draw 1 real tile
  };

  // --- PLAY LOGIC ---
  window.playTile = async (idx) => {
    const ref = doc(db,"rooms",roomId);
    const s = await getDoc(ref);
    let g = s.data();
    if(g.turn !== myId) return;

    let t = g.players[myId].tiles[idx];
    let played = false;

    if(g.board.length === 0){
      g.board.push(t); played = true;
    } else {
      let head = g.board[0].a;
      let tail = g.board[g.board.length-1].b;
      
      if(tail === t.a) { g.board.push(t); played=true; }
      else if(tail === t.b) { g.board.push({a:t.b,b:t.a}); played=true; }
      else if(head === t.b) { g.board.unshift(t); played=true; }
      else if(head === t.a) { g.board.unshift({a:t.b,b:t.a}); played=true; }
    }

    if(!played) return alert("Tile doesn't match!");

    g.players[myId].tiles.splice(idx,1);
    
    if(g.players[myId].tiles.length === 0) alert("🎉 YOU WON!");

    let ids = Object.keys(g.players).sort();
    let next = ids[(ids.indexOf(myId)+1)%ids.length];
    
    await updateDoc(ref, { board: g.board, players: g.players, turn: next });
  };
</script>
</body>
</html>
