    bDiv.innerHTML = "";
    g.board.forEach(t => {
      let isDouble = (t.a === t.b);
      bDiv.innerHTML += `<div class="tile ${isDouble?'tile-v':'tile-h'}">${getPips(t.a)}<div class="${isDouble?'line-v':'line-h'}"></div>${getPips(t.b)}</div>`;
    });

    let hDiv = document.getElementById("myHand");
    hDiv.innerHTML = "";
    if(g.players[myId]){
      g.players[myId].tiles.forEach((t, i) => {
        let isPlayable = false;
        if(isTurn) {
            if(g.board.length === 0) isPlayable = true;
            else {
                let h = g.board[0].a, tl = g.board[g.board.length-1].b;
                if(t.a===h || t.b===h || t.a===tl || t.b===tl) isPlayable = true;
            }
        }
        hDiv.innerHTML += `<div class="hand-tile ${isPlayable ? 'playable' : ''}" onclick="${isPlayable ? `playTile(${i})` : ''}">${getPips(t.a)}<div style="width:100%;height:1px;background:#ccc"></div>${getPips(t.b)}</div>`;
      });
    }

    let oDiv = document.getElementById("opponents");
    oDiv.innerHTML = "";
    Object.keys(g.players).forEach(pid => {
       if(pid !== myId){
         oDiv.innerHTML += `<div class="avatar ${g.turn===pid?'active-player':''}"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${g.players[pid].name}"><div class="card-count">${g.players[pid].tiles.length}</div></div>`;
       }
    });
    window.remainingTiles = g.tiles.length;
    
    // Render Chat
    if(g.chats) updateChat(g.chats);

    setTimeout(() => {
        let bs = document.getElementById("boardScroll"), ba = document.getElementById("boardArea");
        if(bs.scrollWidth > ba.clientWidth) {
            let s = ba.clientWidth / (bs.scrollWidth + 40);
            bs.style.transform = `scale(${Math.max(s, 0.4)})`;
        } else { bs.style.transform = `scale(1)`; }
    }, 100);
  }

  function canPlayAny(g){
      if(g.board.length === 0) return true;
      let h = g.board[0].a, tl = g.board[g.board.length-1].b;
      return g.players[myId].tiles.some(t => t.a===h || t.b===h || t.a===tl || t.b===tl);
  }

  // --- ACTIONS ---
  window.openBoneyard = () => {
      let grid = document.getElementById("boneyardGrid");
      grid.innerHTML = "";
      let count = Math.min(window.remainingTiles, 14);
      if(count===0) return alert("Boneyard Empty! Turn Skipped.");
      for(let i=0;i<count;i++){
          let d=document.createElement("div"); d.className="facedown-tile";
          d.onclick=()=>confirmDraw(); grid.appendChild(d);
      }
      document.getElementById("boneyardModal").style.display="flex";
  }
  window.closeBoneyard = () => document.getElementById("boneyardModal").style.display="none";
  window.confirmDraw = async () => { closeBoneyard(); await drawTiles(1); };

  window.playTile = async (idx) => {
    playSound('click');
    const ref = doc(db,"rooms",roomId);
    const s = await getDoc(ref);
    let g = s.data();
    let t = g.players[myId].tiles[idx];
    let played = false;

    if(g.board.length === 0){ g.board.push(t); played = true; }
    else {
      let h = g.board[0].a, tl = g.board[g.board.length-1].b;
      if(tl === t.a) { g.board.push(t); played=true; }
      else if(tl === t.b) { g.board.push({a:t.b,b:t.a}); played=true; }
      else if(h === t.b) { g.board.unshift(t); played=true; }
      else if(h === t.a) { g.board.unshift({a:t.b,b:t.a}); played=true; }
    }
    if(!played) return;
    g.players[myId].tiles.splice(idx,1);

    if(g.players[myId].tiles.length === 0) {
        let roundPoints = 0;
        Object.keys(g.players).forEach(pid => {
            if(pid !== myId){
                g.players[pid].tiles.forEach(tile => roundPoints += (tile.a + tile.b));
            }
        });
        g.scores[myId] += roundPoints;
        let matchOver = g.scores[myId] >= g.targetScore;
        await updateDoc(ref, { 
            board: g.board, players: g.players, scores: g.scores,
            status: matchOver ? "match_finished" : "round_finished",
            winner: myId, lastPoints: roundPoints
        });
    } else {
        let ids = Object.keys(g.players).sort();
        let next = ids[(ids.indexOf(myId)+1)%ids.length];
        await updateDoc(ref, { board: g.board, players: g.players, turn: next });
    }
  };

  window.nextRound = async () => {
      const ref = doc(db,"rooms",roomId);
      const s = await getDoc(ref);
      let g = s.data();
      let newTiles = generateTiles();
      Object.keys(g.players).forEach(pid => g.players[pid].tiles = []);
      await updateDoc(ref, {
          board: [], tiles: newTiles, status: "playing",
          players: g.players, winner: null, turn: g.winner
      });
  };

  // --- WHATSAPP STYLE CHAT ---
  window.toggleChat = () => { let b = document.getElementById("chatBox"); b.style.display = b.style.display==="flex"?"none":"flex"; };
  window.sendChat = async () => {
      let inp = document.getElementById("chatInp"); if(!inp.value) return;
      await updateDoc(doc(db,"rooms",roomId), { chats: arrayUnion({ sender: myName, text: inp.value, id: myId }) });
      inp.value = "";
  };
  
  let lastChatLen = 0;
  function updateChat(messages){
      if(messages.length > lastChatLen && messages[messages.length-1].id !== myId) {
          playSound('msg');
          let icon = document.getElementById("chatIcon");
          icon.style.animation = "bounce 0.5s";
          setTimeout(()=> icon.style.animation="", 500);
      }
      lastChatLen = messages.length;

      let div = document.getElementById("chatMessages");
      div.innerHTML = messages.map(m => `
        <div class="chat-bubble ${m.id === myId ? 'my-msg' : 'other-msg'}">
            <span class="sender-name">${m.sender}</span>
            ${m.text}
        </div>`).join("");
      div.scrollTop = div.scrollHeight;
  }

  // --- VIDEO CALL (FIXED RESIZABLE) ---
  window.toggleVideo = () => {
      let box = document.getElementById("videoContainer");
      let frame = document.getElementById("videoFrame");
      
      if(box.style.display === "block"){
          box.style.display = "none";
          frame.src = "";
      } else {
          box.style.display = "block";
          frame.src = "https://p2p.mirotalk.com/join/" + roomId + "?video=true&audio=true";
      }
  };

  window.resizeVideo = () => {
      let box = document.getElementById("videoContainer");
      let btn = document.getElementById("resizeVideo");
      
      if(box.classList.contains("minimized")){
          box.classList.remove("minimized");
          btn.innerText = "➖"; // Show Minimize Icon
      } else {
          box.classList.add("minimized");
          btn.innerText = "➕"; // Show Maximize Icon
      }
  };
</script>
</body>
</html>
