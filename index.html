!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Domino Pro Video</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- JITSI MEET API (FREE VIDEO CALL) -->
  <script src='https://meet.jit.si/external_api.js'></script>
  
  <style>
    /* --- CORE --- */
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; }

    /* --- TABLE --- */
    #table {
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #1e6028 20%, #051a07 100%);
      position: relative; display: flex; flex-direction: column; justify-content: space-between;
    }
    #table::before {
      content: ""; position: absolute; top:0; left:0; right:0; bottom:0;
      border: 12px solid #3e2723; box-shadow: inset 0 0 100px #000;
      pointer-events: none; z-index: 10;
    }

    /* --- BOARD --- */
    #boardArea {
      flex: 1; display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative; width: 100%;
    }
    #boardScroll {
      display: flex; align-items: center; justify-content: center;
      padding: 50px; transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* --- TILES --- */
    .tile {
      background: linear-gradient(135deg, #fffbf0 0%, #dcd0b0 100%);
      border-radius: 5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.8);
      position: relative; display: flex; box-sizing: border-box;
      border: 1px solid #999; margin: 1px;
    }
    .tile-h { width: 64px; height: 32px; flex-direction: row; }
    .tile-v { width: 32px; height: 64px; flex-direction: column; }
    .line-h { width: 1px; height: 100%; background: #bdc3c7; }
    .line-v { width: 100%; height: 1px; background: #bdc3c7; }
    .pips { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 3px; }
    .dot { width: 5px; height: 5px; background: #000; border-radius: 50%; margin: auto; box-shadow: inset 0 1px 1px rgba(255,255,255,0.9); }

    /* --- HAND --- */
    .my-area {
      background: linear-gradient(to top, #000 0%, transparent 100%);
      padding: 10px; display: flex; flex-direction: column; align-items: center; z-index: 20; position: relative;
    }
    .my-hand { display: flex; gap: 10px; overflow-x: auto; padding: 20px 10px; max-width: 100%; min-height: 90px; }

    .hand-tile {
      width: 38px; height: 76px; background: #ccc; 
      display: flex; flex-direction: column; border-radius: 6px; 
      box-shadow: 0 5px 10px rgba(0,0,0,0.5); transition: all 0.3s; 
      opacity: 0.6; transform: scale(0.9);
    }
    .playable {
      background: linear-gradient(135deg, #fff 0%, #fffbf0 100%);
      opacity: 1 !important; transform: scale(1.1) !important;
      box-shadow: 0 0 15px #ffd700, 0 0 5px white !important;
      border: 2px solid gold; cursor: pointer;
      animation: bounce 1s infinite alternate;
    }
    @keyframes bounce { from { transform: translateY(0) scale(1.1); } to { transform: translateY(-5px) scale(1.1); } }

    /* --- VIDEO CALL BOX (NEW) --- */
    #videoContainer {
        display: none; position: absolute; top: 60px; right: 10px;
        width: 150px; height: 200px; background: black;
        border: 2px solid gold; border-radius: 10px; z-index: 80;
        overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    #videoToggleBtn {
        position: absolute; top: 20px; right: 10px; z-index: 90;
        background: #e11d48; color: white; border: none;
        padding: 8px 12px; border-radius: 20px; cursor: pointer;
        font-weight: bold; font-size: 12px; display: flex; align-items: center; gap: 5px;
        box-shadow: 0 2px 5px black;
    }
    #closeVideo {
        position: absolute; top: 5px; right: 5px; background: red; color: white;
        border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; z-index: 100;
        font-size: 12px;
    }

    /* --- CHAT --- */
    #chatIcon {
        position: absolute; bottom: 120px; right: 20px; z-index: 50;
        width: 50px; height: 50px; background: #3b82f6; border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        color: white; font-size: 24px; box-shadow: 0 0 15px #3b82f6; cursor: pointer;
    }
    #chatBox {
        display: none; position: absolute; bottom: 180px; right: 20px; width: 250px; height: 300px;
        background: rgba(0,0,0,0.9); border: 2px solid #333; border-radius: 10px;
        z-index: 60; flex-direction: column; overflow: hidden;
    }
    #chatMessages { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; color: white; display: flex; flex-direction: column; gap: 5px; }
    .chat-bubble { background: #333; padding: 5px 10px; border-radius: 10px; max-width: 80%; }
    .chat-bubble b { color: #facc15; }
    .chat-input-area { display: flex; border-top: 1px solid #333; }
    #chatInp { flex: 1; padding: 10px; border: none; background: #222; color: white; outline: none; }
    #sendBtn { padding: 0 15px; background: #3b82f6; color: white; border: none; cursor: pointer; }

    /* --- DRAW BUTTON --- */
    #drawBtnContainer {
        position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
        z-index: 50; display: none;
    }
    .draw-btn-pulse {
        background: linear-gradient(to bottom, #ff9800, #e65100);
        color: white; font-weight: bold; padding: 10px 25px;
        border: 2px solid white; border-radius: 30px; font-size: 14px; cursor: pointer;
        box-shadow: 0 0 20px #ff9800; animation: pulseBtn 0.8s infinite alternate;
    }
    @keyframes pulseBtn { from { transform: scale(1); } to { transform: scale(1.1); } }

    /* --- UI ELEMENTS --- */
    .top-bar { position: absolute; top: 20px; left: 20px; z-index: 20; display: flex; gap: 10px; }
    .badge { background: rgba(0,0,0,0.6); color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; border: 1px solid #555; display:flex; align-items:center; gap:5px;}
    .opponents { display: flex; justify-content: center; gap: 15px; padding-top: 25px; z-index: 15; }
    .avatar { width: 55px; height: 55px; border-radius: 50%; background: #333; border: 2px solid #555; position: relative; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
    .avatar img { width: 100%; height: 100%; border-radius: 50%; opacity: 0.6; }
    .active-player { border-color: #4ade80; box-shadow: 0 0 20px #4ade80; transform: scale(1.1); transition: 0.3s; }
    .active-player img { opacity: 1; }
    .card-count { position: absolute; bottom: -5px; right: -5px; background: #ef4444; color: white; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: bold; display: flex; justify-content: center; align-items: center; border: 2px solid white; }

    .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; flex-direction: column; justify-content: center; align-items: center; }
    .winner-box { background: linear-gradient(135deg, #ffd700, #ff8c00); padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 0 50px gold; border: 5px solid white; animation: popIn 0.5s; }
    @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
    .boneyard-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 80%; }
    .facedown-tile { width: 36px; height: 68px; background: linear-gradient(135deg, #a8a29e 0%, #44403c 100%); border: 2px solid #d6d3d1; border-radius: 4px; cursor: pointer; }

    #login { position: absolute; top:0; left:0; width:100%; height:100%; background: #111; z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
    input { padding: 12px; margin: 10px; border-radius: 8px; border: 1px solid #333; background:#222; color:white; text-align: center; font-size: 16px; width: 200px; }
    .btn { padding: 12px 30px; margin: 5px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
    .btn-gold { background: linear-gradient(to bottom, #facc15, #ca8a04); color: black; }

  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <img src="https://cdn-icons-png.flaticon.com/512/566/566324.png" width="80" style="margin-bottom:20px;">
  <h1 style="margin:0; text-transform:uppercase; letter-spacing:2px; color:#facc15;">Domino Pro</h1>
  <input id="pName" placeholder="Your Nickname">
  <button class="btn btn-gold" onclick="createRoom()">Create New Table</button>
  <p style="color:#555; font-size:12px;">- OR -</p>
  <div style="display:flex; gap:10px;">
    <input id="code" placeholder="Room Code" style="width:100px; margin:10px 0;">
    <button class="btn" style="background:#fff;" onclick="joinRoom()">Join</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameOverModal" class="modal">
  <div class="winner-box">
    <h1 style="font-size: 40px; margin:0;">🏆 WINNER!</h1>
    <h2 id="winnerName" style="color: black; margin: 10px;">Player Name</h2>
    <div style="font-size: 50px;">🎉</div>
    <button id="restartBtn" onclick="resetGame()" class="btn" style="background:black; color:white; margin-top:20px;">Start New Round 🔄</button>
    <p id="waitHostMsg" style="font-size:12px; color:black; margin-top:10px; display:none;">Waiting for host to restart...</p>
  </div>
</div>

<!-- BONEYARD -->
<div id="boneyardModal" class="modal">
  <h2 style="color:white;">Draw Tile</h2>
  <div class="boneyard-grid" id="boneyardGrid"></div>
  <button onclick="closeBoneyard()" style="margin-top:20px; padding:10px; background:#333; color:white; border:none; border-radius:5px;">Cancel</button>
</div>

<!-- TABLE -->
<div id="table">
  <div class="top-bar">
    <div class="badge"><i class="fas fa-wifi"></i> <span id="roomInfo">...</span></div>
  </div>

  <!-- VIDEO CALL BUTTON -->
  <button id="videoToggleBtn" onclick="toggleVideo()">🎥 Video</button>

  <!-- VIDEO CONTAINER -->
  <div id="videoContainer">
      <button id="closeVideo" onclick="toggleVideo()">X</button>
      <div id="jitsiFrame" style="width:100%; height:100%;"></div>
  </div>

  <div class="opponents" id="opponents"></div>

  <div id="boardArea">
    <div id="boardScroll"></div>
  </div>

  <div id="drawBtnContainer">
    <button class="draw-btn-pulse" onclick="openBoneyard()">🎲 DRAW CARD</button>
  </div>

  <!-- CHAT -->
  <div id="chatIcon" onclick="toggleChat()">💬</div>
  <div id="chatBox">
    <div id="chatMessages"></div>
    <div class="chat-input-area">
        <input id="chatInp" placeholder="Type message...">
        <button id="sendBtn" onclick="sendChat()">➤</button>
    </div>
  </div>

  <div class="my-area">
    <div id="turnMsg" style="color:white; font-weight:bold; margin-bottom:5px; font-size:14px;">Connecting...</div>
    <div class="my-hand" id="myHand"></div>
  </div>
</div>

<!-- LOGIC -->
<script type="module">
  const ADMIN_WHATSAPP = "971566932862"; 

  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, updateDoc, getDoc, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAXXWgGt8WbMzmgn2ukdB4qtP5xwr2jz5E",
    authDomain: "studio-343961532-65f17.firebaseapp.com",
    projectId: "studio-343961532-65f17",
    storageBucket: "studio-343961532-65f17.firebasestorage.app",
    messagingSenderId: "667987171288",
    appId: "1:667987171288:web:ffadb2286957b28b4b84ad"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let myId, roomId, myName;
  signInAnonymously(auth);

  const dotPos = { 0: [], 1: [4], 2: [2,6], 3: [2,4,6], 4: [0,2,6,8], 5: [0,2,4,6,8], 6: [0,2,3,5,6,8] };
  function getPips(n) {
    let h = ""; for(let i=0; i<9; i++) h += dotPos[n].includes(i) ? `<div class="dot"></div>` : `<div></div>`;
    return `<div class="pips">${h}</div>`;
  }

  // --- GAME START ---
  window.createRoom = async () => {
    myName = document.getElementById("pName").value || "Host";
    roomId = Math.random().toString(36).substring(2,6).toUpperCase();
    myId = "p1";
    let tiles = generateTiles();
    await setDoc(doc(db,"rooms",roomId), {
      board: [], tiles: tiles, turn: "p1", status: "playing", chats: [],
      players: { p1: { name: myName, tiles: [] } }
    });
    setTimeout(()=>drawTiles(7), 800);
    enterGame();
  };

  window.joinRoom = async () => {
    myName = document.getElementById("pName").value || "Guest";
    roomId = document.getElementById("code").value.toUpperCase();
    const ref = doc(db,"rooms",roomId);
    const snap = await getDoc(ref);
    if(!snap.exists()) return alert("Invalid Room");
    let d = snap.data();
    if(Object.keys(d.players).length >= 4) return alert("Full");
    myId = "p"+(Object.keys(d.players).length+1);
    d.players[myId] = { name: myName, tiles: [] };
    await updateDoc(ref, { players: d.players });
    setTimeout(()=>drawTiles(7), 800);
    enterGame();
  };

  function generateTiles(){
      let t=[]; for(let i=0;i<=6;i++) for(let j=i;j<=6;j++) t.push({a:i,b:j});
      return t.sort(()=>Math.random()-0.5);
  }

  async function drawTiles(n){
    const ref = doc(db,"rooms",roomId);
    const s = await getDoc(ref);
    let d = s.data();
    if(d.tiles.length < n) return;
    let hand = d.tiles.splice(0, n);
    d.players[myId].tiles.push(...hand);
    await updateDoc(ref, { players: d.players, tiles: d.tiles });
  }

  function enterGame(){
    document.getElementById("login").style.display = "none";
    document.getElementById("roomInfo").innerText = "Code: " + roomId;
    onSnapshot(doc(db,"rooms",roomId), (snap) => render(snap.data()));
  }

  // --- RENDER ---
  function render(g){
    if(g.status === "playing" && document.getElementById("gameOverModal").style.display === "flex"){
        document.getElementById("gameOverModal").style.display = "none";
        if(g.players[myId].tiles.length === 0) setTimeout(()=>drawTiles(7), 500);
    }

    if(g.status === "finished") {
        document.getElementById("gameOverModal").style.display = "flex";
        document.getElementById("winnerName").innerText = g.players[g.winner]?.name || "Unknown";
        if(myId === "p1" || myId === g.winner){
             document.getElementById("restartBtn").style.display = "inline-block";
             document.getElementById("waitHostMsg").style.display = "none";
        } else {
             document.getElementById("restartBtn").style.display = "none";
             document.getElementById("waitHostMsg").style.display = "block";
        }
        return;
    }

    let isTurn = (g.turn === myId);
    let hasMove = canPlayAny(g);
    document.getElementById("drawBtnContainer").style.display = (isTurn && !hasMove && g.tiles.length > 0) ? "block" : "none";
    document.getElementById("turnMsg").innerHTML = isTurn ? (hasMove ? `<span style="color:#4ade80">🟢 YOUR TURN</span>` : `<span style="color:#ff9800">⚠️ No moves! Draw card.</span>`) : `<span style="color:#aaa">Waiting for ${g.players[g.turn].name}...</span>`;

    let bDiv = document.getElementById("boardScroll");
    bDiv.innerHTML = "";
    g.board.forEach(t => {
      let isDouble = (t.a === t.b);
      bDiv.innerHTML += `<div class="tile ${isDouble?'tile-v':'tile-h'}">${getPips(t.a)}<div class="${isDouble?'line-v':'line-h'}"></div>${getPips(t.b)}</div>`;
    });

    let hDiv = document.getElementById("myHand");
    hDiv.innerHTML = "";
    if(g.players[myId]){
      g.players[myId].tiles.forEach((t, i) => {
        let isPlayable = false;
        if(isTurn) {
            if(g.board.length === 0) isPlayable = true;
            else {
                let h = g.board[0].a, tl = g.board[g.board.length-1].b;
                if(t.a===h || t.b===h || t.a===tl || t.b===tl) isPlayable = true;
            }
        }
        hDiv.innerHTML += `<div class="hand-tile ${isPlayable ? 'playable' : ''}" onclick="${isPlayable ? `playTile(${i})` : ''}">${getPips(t.a)}<div style="width:100%;height:1px;background:#ccc"></div>${getPips(t.b)}</div>`;
      });
    }

    let oDiv = document.getElementById("opponents");
    oDiv.innerHTML = "";
    Object.keys(g.players).forEach(pid => {
       if(pid !== myId){
         oDiv.innerHTML += `<div class="avatar ${g.turn===pid?'active-player':''}"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${g.players[pid].name}"><div class="card-count">${g.players[pid].tiles.length}</div></div>`;
       }
    });
    window.remainingTiles = g.tiles.length;
    updateChat(g.chats || []);

    setTimeout(() => {
        let bs = document.getElementById("boardScroll"), ba = document.getElementById("boardArea");
        if(bs.scrollWidth > ba.clientWidth) {
            let s = ba.clientWidth / (bs.scrollWidth + 40);
            bs.style.transform = `scale(${Math.max(s, 0.4)})`;
        } else { bs.style.transform = `scale(1)`; }
    }, 100);
  }

  function canPlayAny(g){
      if(g.board.length === 0) return true;
      let h = g.board[0].a, tl = g.board[g.board.length-1].b;
      return g.players[myId].tiles.some(t => t.a===h || t.b===h || t.a===tl || t.b===tl);
  }

  window.openBoneyard = () => {
      let grid = document.getElementById("boneyardGrid");
      grid.innerHTML = "";
      let count = Math.min(window.remainingTiles, 14);
      if(count===0) return alert("Boneyard Empty! Turn Skipped.");
      for(let i=0;i<count;i++){
          let d=document.createElement("div"); d.className="facedown-tile";
          d.onclick=()=>confirmDraw(); grid.appendChild(d);
      }
      document.getElementById("boneyardModal").style.display="flex";
  }
  window.closeBoneyard = () => document.getElementById("boneyardModal").style.display="none";
  window.confirmDraw = async () => { closeBoneyard(); await drawTiles(1); };

  window.playTile = async (idx) => {
    const ref = doc(db,"rooms",roomId);
    const s = await getDoc(ref);
    let g = s.data();
    let t = g.players[myId].tiles[idx];
    let played = false;

    if(g.board.length === 0){ g.board.push(t); played = true; }
    else {
      let h = g.board[0].a, tl = g.board[g.board.length-1].b;
      if(tl === t.a) { g.board.push(t); played=true; }
      else if(tl === t.b) { g.board.push({a:t.b,b:t.a}); played=true; }
      else if(h === t.b) { g.board.unshift(t); played=true; }
      else if(h === t.a) { g.board.unshift({a:t.b,b:t.a}); played=true; }
    }
    if(!played) return;
    g.players[myId].tiles.splice(idx,1);

    if(g.players[myId].tiles.length === 0) {
        await updateDoc(ref, { board: g.board, players: g.players, status: "finished", winner: myId });
    } else {
        let ids = Object.keys(g.players).sort();
        let next = ids[(ids.indexOf(myId)+1)%ids.length];
        await updateDoc(ref, { board: g.board, players: g.players, turn: next });
    }
  };

  window.resetGame = async () => {
      const ref = doc(db,"rooms",roomId);
      const s = await getDoc(ref);
      let g = s.data();let newTiles = generateTiles();
      Object.keys(g.players).forEach(pid => g.players[pid].tiles = []);
      await updateDoc(ref, {
          board: [], tiles: newTiles, status: "playing",
          players: g.players, winner: null, turn: g.winner
      });
  };

  window.toggleChat = () => { let b = document.getElementById("chatBox"); b.style.display = b.style.display==="flex"?"none":"flex"; };
  window.sendChat = async () => {
      let inp = document.getElementById("chatInp"); if(!inp.value) return;
      await updateDoc(doc(db,"rooms",roomId), { chats: arrayUnion({ sender: myName, text: inp.value }) });
      inp.value = "";
  };
  function updateChat(messages){
      let div = document.getElementById("chatMessages");
      div.innerHTML = messages.map(m => `<div class="chat-bubble"><b>${m.sender}:</b> ${m.text}</div>`).join("");
      div.scrollTop = div.scrollHeight;
  }

  // --- VIDEO CALL LOGIC ---
  let jitsiApi = null;
  window.toggleVideo = () => {
      let box = document.getElementById("videoContainer");
      if(box.style.display === "block"){
          box.style.display = "none";
          if(jitsiApi) { jitsiApi.dispose(); jitsiApi = null; }
      } else {
          box.style.display = "block";
          if(!jitsiApi) startJitsi();
      }
  };

  function startJitsi(){
      const domain = 'meet.jit.si';
      const options = {
          roomName: 'DominoRoom_' + roomId,
          width: '100%', height: '100%',
          parentNode: document.querySelector('#jitsiFrame'),
          userInfo: { displayName: myName },
          interfaceConfigOverwrite: { 
              TOOLBAR_BUTTONS: ['microphone', 'camera', 'hangup'],
              SHOW_JITSI_WATERMARK: false 
          }
      };
      jitsiApi = new JitsiMeetExternalAPI(domain, options);
  }

</script>
</body>
</html>
